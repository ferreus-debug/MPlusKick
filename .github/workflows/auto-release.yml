name: Auto release

# Every push to main that touches the addon bumps the version, tags it and
# publishes to CurseForge + GitHub Releases.
#   - Default bump is patch (v0.6.0 -> v0.6.1).
#   - Put "#minor" or "#major" in the commit message for a bigger bump.
#   - Put "[skip release]" in the commit message to push without releasing
#     (a manual run from the Actions tab releases anyway).
# Can also be run by hand from the Actions tab with a chosen bump.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'branding/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: ver
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          msg=$(git log -1 --pretty=%B)
          # Only pushes honor [skip release]; a manual run always releases.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$msg" == *"[skip release]"* ]]; then
            echo "Commit asks to skip release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A tag pushed together with this commit is released by release.yml.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          bump="${INPUT_BUMP:-patch}"
          [[ "$msg" == *"#minor"* ]] && bump=minor
          [[ "$msg" == *"#major"* ]] && bump=major
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "$last -> $tag ($bump)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # A tag pushed with GITHUB_TOKEN doesn't trigger release.yml, and the
      # packager skips a branch build whose HEAD is tagged, so start
      # release.yml on the tag by hand: it packages and uploads.
      - name: Start release for the tag
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
